<script>
/* ============================================================
   2. RUNTIME SETUP — React, htm templates, icons, motion
   ============================================================ */
const { useState, useEffect, useRef, useMemo, useCallback } = React;
const html = htm.bind(React.createElement);

const FM = window.Motion || window.FramerMotion || null;
const fallbackMotion = new Proxy({}, { get: (_t, tag) => React.forwardRef((props, ref) => {
  const { initial, animate, exit, transition, whileHover, whileTap, whileInView,
          viewport, variants, layout, layoutId, drag, ...rest } = props;
  return React.createElement(tag, Object.assign({}, rest, { ref }));
})});
const motion = (FM && FM.motion) || fallbackMotion;
const AnimatePresence = (FM && FM.AnimatePresence) || (({ children }) => children);

/* Lucide icon -> React component */
function Icon({ name, size = 18, className = "", strokeWidth = 2 }) {
  const L = window.lucide || {};
  const node = L[name] || (L.icons && L.icons[name]);
  if (!node) return html`<span className=${className} style=${{width:size,height:size,display:'inline-block'}} />`;
  const kids = node.map(([tag, attrs], i) => React.createElement(tag, Object.assign({ key: i }, attrs)));
  return React.createElement("svg", {
    className, width: size, height: size, viewBox: "0 0 24 24", fill: "none",
    stroke: "currentColor", strokeWidth, strokeLinecap: "round", strokeLinejoin: "round",
    "aria-hidden": "true"
  }, kids);
}

/* Scroll reveal */
function Reveal({ children, delay = 0, y = 26, className = "" }) {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } }, { threshold: 0.12 });
    io.observe(el); return () => io.disconnect();
  }, []);
  return html`<div ref=${ref} className=${className} style=${{
    opacity: seen ? 1 : 0,
    transform: seen ? "none" : `translateY(${y}px)`,
    transition: "opacity .7s cubic-bezier(.2,.8,.25,1), transform .7s cubic-bezier(.2,.8,.25,1)",
    transitionDelay: delay + "ms"
  }}>${children}</div>`;
}

/* Section heading */
function Heading({ kicker, title, sub, center = true }) {
  return html`
    <${Reveal} className=${"mb-12 " + (center ? "text-center" : "")}>
      <p className="font-hand text-2xl text-[var(--pink)]">${kicker}</p>
      <h2 className="font-display text-4xl md:text-5xl font-semibold mt-1 grad-text leading-tight pb-1">${title}</h2>
      ${sub && html`<p className=${"text-[var(--muted)] mt-3 max-w-2xl " + (center ? "mx-auto" : "")}>${sub}</p>`}
    <//>`;
}

function Pill({ children, className = "" }) {
  return html`<span className=${"inline-flex items-center gap-1.5 rounded-full border border-[var(--line)] bg-[var(--surface)] px-3 py-1 text-xs font-medium text-[var(--muted)] " + className}>${children}</span>`;
}

function Btn({ children, onClick, href, variant = "solid", icon, className = "" }) {
  const base = "group inline-flex items-center justify-center gap-2 rounded-full px-6 py-3 text-sm font-semibold transition-all duration-300";
  const styles = variant === "solid"
    ? "text-white bg-gradient-to-r from-pinky via-lilac to-peach hover:shadow-[0_14px_38px_-12px_rgba(166,120,240,.9)] hover:-translate-y-0.5"
    : "glass text-[var(--txt)] hover:border-[var(--pink)] hover:-translate-y-0.5";
  const inner = html`<>${children}${icon && html`<${Icon} name=${icon} size=${16} className="transition-transform duration-300 group-hover:translate-x-0.5" />`}<//>`;
  return href
    ? html`<a href=${href} className=${base + " " + styles + " " + className}>${inner}</a>`
    : html`<button onClick=${onClick} className=${base + " " + styles + " " + className}>${inner}</button>`;
}
</script>

function Bar({ value, color }) {
  const ref = useRef(null);
  const [w, setW] = useState(0);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setW(value); io.disconnect(); } }, { threshold: .4 });
    io.observe(el); return () => io.disconnect();
  }, [value]);
  return html`
    <div ref=${ref} className="h-2 w-full rounded-full bg-[var(--line)] overflow-hidden">
      <div className=${"h-full rounded-full bg-gradient-to-r " + color}
        style=${{ width: w + "%", transition: "width 1.2s cubic-bezier(.2,.8,.25,1)", boxShadow: "0 0 12px rgba(255,122,168,.7)" }}></div>
    </div>`;
}

   ============================================================ */
const CATS = ["All", ...Array.from(new Set(DATA.projects.map(p => p.cat)))];

function ProjectsPage({ go, onOpen }) {
  const [cat, setCat] = useState("All");
  const [q, setQ] = useState("");

  const list = useMemo(() => DATA.projects.filter(p => {
    const inCat = cat === "All" || p.cat === cat;
    const term = q.trim().toLowerCase();
    const inQ = !term || (p.title + p.short + p.tags.join(" ")).toLowerCase().includes(term);
    return inCat && inQ;
  }), [cat, q]);

  return html`
  <main className="pt-36 pb-24">
    <div className="blob h-72 w-72 bg-lilac/45 right-0 top-24"></div>
    <div className="mx-auto max-w-6xl px-4">
      <button onClick=${() => go("home", "home")}
        className="inline-flex items-center gap-2 text-sm font-medium text-[var(--muted)] hover:text-[var(--pink)] transition-colors">
        <${Icon} name="ArrowLeft" size=${16} /> Back home
      </button>

      <div className="mt-6 pop">
        <p className="font-hand text-3xl text-[var(--pink)]">the full collection</p>
        <h1 className="font-display text-5xl md:text-6xl font-semibold grad-text leading-tight pb-1">Projects</h1>
        <p className="text-[var(--muted)] mt-3 max-w-2xl">
          ${DATA.projects.length} builds across WordPress, e-commerce, front-end and full-stack. Open any card for the full story.
        </p>
      </div>

      <div className="mt-9 glass rounded-4xl p-4 flex flex-col md:flex-row gap-4 md:items-center md:justify-between">
        <div className="flex flex-wrap gap-2">
          ${CATS.map(c => html`
            <button key=${c} onClick=${() => setCat(c)}
              className=${"rounded-full px-4 py-2 text-sm font-semibold transition-all duration-300 " +
                (cat === c
                  ? "text-white bg-gradient-to-r from-pinky to-lilac shadow-[0_10px_26px_-12px_rgba(166,120,240,.95)]"
                  : "text-[var(--muted)] border border-[var(--line)] hover:text-[var(--pink)] hover:border-[var(--pink)]")}>
              ${c}
              <span className="ml-1.5 opacity-70 text-xs">
                ${c === "All" ? DATA.projects.length : DATA.projects.filter(p => p.cat === c).length}
              </span>
            </button>`)}
        </div>
        <div className="relative md:w-64">
          <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-[var(--muted)]"><${Icon} name="Search" size=${16} /></span>
          <input value=${q} onChange=${e => setQ(e.target.value)} placeholder="Search projects…"
            className="w-full rounded-full border border-[var(--line)] bg-[var(--surface)] pl-10 pr-4 py-2.5 text-sm outline-none transition-all focus:border-[var(--pink)] focus:ring-4 focus:ring-pinky/15" />
        </div>
      </div>

      ${list.length
        ? html`<div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-8">
            ${list.map((p, i) => html`<${ProjectCard} key=${p.id} p=${p} onOpen=${onOpen} delay=${(i % 3) * 90} />`)}
          </div>`
        : html`<div className="glass rounded-4xl p-14 text-center mt-8">
            <p className="text-5xl">🔍</p>
            <p className="font-display text-xl font-semibold mt-3">Nothing matches that yet</p>
            <p className="text-[var(--muted)] text-sm mt-1.5">Clear the search or pick another category to see the rest.</p>
            <div className="mt-6"><${Btn} variant="ghost" onClick=${() => { setQ(""); setCat("All"); }}>Reset filters<//></div>
          </div>`}

      <div className="glass rounded-4xl p-9 md:p-12 mt-14 text-center relative overflow-hidden">
        <div className="blob h-52 w-52 bg-pinky/50 -left-10 -top-10"></div>
        <p className="font-hand text-3xl text-[var(--pink)] relative">next one could be yours</p>
        <h2 className="font-display text-3xl md:text-4xl font-semibold mt-1 relative">Got a site that needs building?</h2>
        <div className="mt-6 relative"><${Btn} href=${"mailto:" + DATA.email} icon="Send">Start a project<//></div>
      </div>
    </div>
  </main>`;
}

function HomePage({ go, onOpen }) {
  return html`
  <main>
    <${Hero} go=${go} />
    <${Marquee} />
    <${About} />
    <${Skills} />
    <${Services} />
    <${ProjectsPreview} go=${go} onOpen=${onOpen} />
    <${Experience} />
    <${Education} />
    <${Contact} />
  </main>`;
}

function App() {
  const [page, setPage] = useState("home");
  const [active, setActive] = useState(null);
  const [theme, setTheme] = useState("light");

  useEffect(() => {
    try {
      const saved = localStorage.getItem("sc-theme");
      if (saved === "dark" || saved === "light") setTheme(saved);
      else if (window.matchMedia("(prefers-color-scheme: dark)").matches) setTheme("dark");
    } catch (e) { /* storage unavailable — keep the light theme */ }
  }, []);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("sc-theme", theme); } catch (e) { /* ignore */ }
  }, [theme]);

  const go = useCallback((target, anchor) => {
    if (target === "projects") {
      setPage("projects");
      window.scrollTo({ top: 0 });
      return;
    }
    setPage("home");
    requestAnimationFrame(() => {
      if (!anchor) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
      const el = document.getElementById(anchor === "work" ? "work-preview" : anchor);
      if (el) window.scrollTo({ top: el.offsetTop - 90, behavior: "smooth" });
      else window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }, []);

  return html`
  <${React.Fragment}>
    <${Nav} page=${page} go=${go} theme=${theme} toggleTheme=${() => setTheme(t => t === "dark" ? "light" : "dark")} />
    ${page === "home"
      ? html`<${HomePage} go=${go} onOpen=${setActive} />`
      : html`<${ProjectsPage} go=${go} onOpen=${setActive} />`}
    <${Footer} go=${go} />
    ${active && html`<${ProjectModal} p=${active} onClose=${() => setActive(null)} />`}
  <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
